# Development broker config (Mosquitto 2.x).
# Mosquitto 2 only accepts connections from localhost by default.
# This lets the backend on another machine connect too. DEV ONLY.
listener 1883
allow_anonymous true
persistence false

# Production (matches the Security & Authentication plan):
#   listener 8883
#   cafile   /etc/mosquitto/certs/ca.crt
#   certfile /etc/mosquitto/certs/server.crt
#   keyfile  /etc/mosquitto/certs/server.key
#   allow_anonymous false
#   password_file /etc/mosquitto/passwd      (mosquitto_passwd -c passwd mps_sim)

# Per-satellite authorisation (production idea): create one broker user per satellite,
# named exactly like its sat_id, and give it write access only to its own topics:
#   acl_file /etc/mosquitto/acl
# acl file:
#   pattern write mps/%u/#          # %u = username, so SAT-01 can only publish under mps/SAT-01/
#   user mps_backend
#   topic read mps/#
# (the simulator currently uses one MQTT_USER for all satellites; per-satellite credentials
#  would be the next step.)
